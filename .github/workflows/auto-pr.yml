name: Auto PR

# Opens a pull request automatically for lane branches.
# Uses the runner's built-in GITHUB_TOKEN - no personal access token needed anywhere.
#
# Requires: Settings -> Actions -> General -> Workflow permissions
#           "Allow GitHub Actions to create and approve pull requests" must be enabled,
#           otherwise gh pr create fails with 403.
#
# IMPORTANT - why workflow_dispatch exists:
#   GitHub resolves a push-triggered workflow from the file as it exists ON THE PUSHED REF,
#   not from the default branch. Branches cut before this workflow landed on master do not
#   contain it, so pushing them triggers nothing at all. The manual sweep below runs from
#   master and opens PRs for every lane branch regardless of what those branches contain.

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR for the pushed branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/open-pr.sh "${{ github.ref_name }}"

      - name: Sweep every lane branch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Enumerate via the API, not git refs: actions/checkout only fetches the
          # triggering ref, so refs/remotes/origin/* would be empty here.
          gh api "repos/$REPO/branches" --paginate --jq '.[].name' \
            | grep -E '^(feat|fix|docs|chore)/' \
            | while read -r branch; do
                bash .github/scripts/open-pr.sh "$branch" || echo "::warning::failed for $branch"
              done
